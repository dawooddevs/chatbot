name: Deploy to cPanel

# Deploys whichever branch is named by the DEPLOY_BRANCH repository variable
# (default: main). Set it to the branch Claude pushes to and every push goes
# live on its own; a manual run from the Actions tab deploys any ref.
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check widget syntax
        run: node --check assets/widget.js

  deploy:
    name: Upload over FTPS
    needs: lint
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target folder
        id: target
        env:
          RAW_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          set -eu
          dir="$RAW_DIR"
          if [ "$dir" = "true" ] || [ "$dir" = "false" ]; then
            echo "::error::FTP_SERVER_DIR is set to '$dir'. That looks like a value meant for FTP_DRY_RUN."
            echo "::error::Set FTP_SERVER_DIR to the folder to upload into ('./' for a scoped FTP account)."
            exit 1
          fi
          # The FTP action insists on a trailing slash.
          case "$dir" in
            */) ;;
            *) dir="$dir/" ;;
          esac
          echo "Uploading into: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Stamp the build
        run: |
          set -eu
          jq -n \
            --arg code "$(git rev-parse --short HEAD)" \
            --arg subject "$(git log -1 --pretty=%s)" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{code: $code, subject: $subject, deployed_at: $at}' > VERSION
          cat VERSION

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Resolved above from the FTP_SERVER_DIR variable.
          server-dir: ${{ steps.target.outputs.dir }}
          # Set the FTP_DRY_RUN variable to true for a first run that changes nothing.
          dry-run: ${{ vars.FTP_DRY_RUN == 'true' }}
          # Never overwrite live credentials, uploads, logs or the installer.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            app/config.php
            storage/**
            assets/uploads/**
            install.php
            README.md
            DEPLOYMENT.md

      - name: Smoke test the deployed site
        if: vars.FTP_DRY_RUN != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://chatbot.dawood.top' }}
        run: |
          set -e
          echo "Checking $SITE_URL"
          status=$(curl -sS -o /tmp/page.html -w '%{http_code}' -L --max-time 30 "$SITE_URL/index.php?r=login")
          echo "HTTP $status"
          test "$status" = "200"
          grep -qi 'sign in' /tmp/page.html
          echo "Login page rendered - deployment looks healthy."
