---
# Used by cPanel -> Git(TM) Version Control ("Deploy HEAD Commit").
# $HOME is the cPanel account home, so nothing account-specific is hard-coded.
# chatbot.dawood.top is the subdomain's document root.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/chatbot.dawood.top
    - /bin/mkdir -p $DEPLOYPATH/api $DEPLOYPATH/app $DEPLOYPATH/assets $DEPLOYPATH/storage/logs
    - /bin/cp -f index.php embed.php .htaccess $DEPLOYPATH/
    - /bin/cp -Rf api/. $DEPLOYPATH/api/
    - /bin/cp -Rf assets/. $DEPLOYPATH/assets/
    # app/config.php is never in git, so this cannot overwrite your live settings.
    - /bin/cp -Rf app/. $DEPLOYPATH/app/
